# Place catalog: sensitive places (location groups G1 to G4) with a buffer.
#
# The enforcement point looks up each row's location group from its own
# coordinates: a row inside a place's buffer takes that place's group, the
# strictest one if buffers overlap, and G5 otherwise. Real data only carries
# coordinates, so this replaces trusting the group named in the request.
#
# Synthetic stand in. Needs LocationMind's real place list and legal review
# before it is used on real data. Coordinates are approximate.

default_buffer_m: 600
outside_group: G5
# When buffers overlap, the group that comes first here wins.
strictness: [G1, G2, G3, G4, G5]

